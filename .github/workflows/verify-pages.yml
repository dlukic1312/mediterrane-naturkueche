name: Verify public artifact
on: [pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/validate-content.mjs
      - run: node scripts/validate-sizes.mjs
      - run: python3 scripts/stage_pages.py
      - run: test -f _site/index.html && test ! -e _site/docs && test ! -e _site/AGENTS.md
