name: Website auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Sortiment und regionale Zuordnungen prüfen
        run: node scripts/validate-content.mjs
      - name: Öffentliche Dateien bereitstellen
        run: python3 scripts/stage_pages.py
      - name: Validate exact staged artifact before upload
        run: python3 scripts/check_staged.py --write-inventory "${{ runner.temp }}/approved-public-inventory.json"
      - name: Fail-closed browser validation of staged artifact
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/governance-playwright --no-audit --no-fund playwright@1.58.2
          /tmp/governance-playwright/node_modules/.bin/playwright install chromium --with-deps
          python3 -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/staged-http.log 2>&1 &
          staged_pid=$!
          trap 'kill "$staged_pid" ${baseline_pid:-} 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
          NODE_PATH=/tmp/governance-playwright/node_modules node scripts/check_staged_browser.cjs
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Website hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published bytes against exact approved artifact
        run: python3 scripts/check_live_baseline.py --mode postdeploy --base-url "${{ steps.deployment.outputs.page_url }}" --approved-inventory "${{ runner.temp }}/approved-public-inventory.json"
